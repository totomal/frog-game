<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frog Fly Eating Game</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172131;color:#fff;font-family:Arial,sans-serif;text-align:center}h1{font-size:22px;margin:14px 0 8px}.info{font-size:20px;margin-bottom:8px}#game{position:relative;width:min(94vw,700px);height:min(70vh,500px);min-height:360px;margin:auto;overflow:hidden;border:4px solid #fff;border-radius:14px;background:linear-gradient(#89d9ff 0 78%,#55b947 78%)}#frog{position:absolute;z-index:3;width:110px;height:110px;object-fit:contain;bottom:8px;left:calc(50% - 55px);pointer-events:none}.fly{position:absolute;z-index:4;font-size:30px;line-height:1;cursor:pointer;filter:drop-shadow(1px 1px 1px #555);animation:wobble .3s infinite alternate}@keyframes wobble{to{transform:rotate(12deg) translateY(-3px)}}#tongue{display:none;position:absolute;z-index:2;height:9px;background:#ff5f96;border:2px solid #a51d58;border-radius:10px;transform-origin:0 50%;pointer-events:none}.pop{position:absolute;z-index:8;color:#fff;font-size:22px;font-weight:bold;animation:pop .45s forwards;pointer-events:none}@keyframes pop{to{transform:translateY(-35px);opacity:0}}button{margin:12px 0;padding:11px 28px;border:0;border-radius:10px;background:#a5ff25;font-size:18px;font-weight:bold;cursor:pointer}.hint{font-size:13px;color:#dce5ef;margin-top:4px}#message{min-height:25px;font-weight:bold}
</style>
</head>
<body>
<h1>Frog Fly Eating Game</h1>
<div class="info">Score: <span id="score">0</span>　Time left: <span id="time">30</span>s</div>
<div id="game"><div id="tongue"></div><img id="frog" src="frog.png" alt="Frog"></div>
<div id="message">Press Start to play</div>
<button id="start">Start</button>
<div class="hint">Move the frog left and right. Click a fly to catch it with the tongue!</div>
<script>
const game=document.querySelector('#game'),frog=document.querySelector('#frog'),tongue=document.querySelector('#tongue'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),msg=document.querySelector('#message'),start=document.querySelector('#start');
let score=0,time=30,running=false,timer,spawnTimer,canTongue=true;
function move(e){if(!running)return;const r=game.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const max=game.clientWidth-frog.offsetWidth;frog.style.left=Math.max(0,Math.min(max,x-frog.offsetWidth/2))+'px'}
function center(el){return{x:el.offsetLeft+el.offsetWidth/2,y:el.offsetTop+el.offsetHeight/2}}
function fireTongue(target){if(!running||!canTongue||!target||!target.classList.contains('fly'))return;const mouth={x:frog.offsetLeft+frog.offsetWidth/2,y:frog.offsetTop+28};const p=center(target),dx=p.x-mouth.x,dy=p.y-mouth.y,len=Math.hypot(dx,dy),angle=Math.atan2(dy,dx)*180/Math.PI;tongue.style.display='block';tongue.style.left=mouth.x+'px';tongue.style.top=mouth.y+'px';tongue.style.width=len+'px';tongue.style.transform='rotate('+angle+'deg)';canTongue=false;setTimeout(()=>{if(target.parentNode){score++;scoreEl.textContent=score;const pop=document.createElement('div');pop.className='pop';pop.textContent='Yum!';pop.style.left=p.x+'px';pop.style.top=p.y+'px';game.appendChild(pop);setTimeout(()=>pop.remove(),500);target.remove()}tongue.style.display='none';canTongue=true},180)}
game.addEventListener('mousemove',move);game.addEventListener('touchmove',move,{passive:true});game.addEventListener('click',e=>{if(e.target.classList.contains('fly'))fireTongue(e.target)});game.addEventListener('touchstart',e=>{if(e.target.classList.contains('fly')){e.preventDefault();fireTongue(e.target)}},{passive:false});
function spawn(){if(!running)return;const f=document.createElement('div');f.className='fly';f.textContent='🪰';f.style.left=(5+Math.random()*88)+'%';f.style.top=(5+Math.random()*60)+'%';game.appendChild(f);setTimeout(()=>f.remove(),3500)}
function end(){running=false;clearInterval(timer);clearInterval(spawnTimer);tongue.style.display='none';document.querySelectorAll('.fly').forEach(f=>f.remove());msg.textContent='Game over! You ate '+score+' flies!';start.disabled=false}
start.onclick=()=>{score=0;time=30;scoreEl.textContent=0;timeEl.textContent=30;msg.textContent='Click the flies!';running=true;canTongue=true;start.disabled=true;spawn();spawnTimer=setInterval(spawn,650);timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end()},1000)};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')frog.style.left=Math.max(0,frog.offsetLeft-25)+'px';if(e.key==='ArrowRight')frog.style.left=Math.min(game.clientWidth-frog.offsetWidth,frog.offsetLeft+25)+'px'});
</script>
</body>
</html>
